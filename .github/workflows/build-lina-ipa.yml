name: Build Lina IPA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-lina-ipa.yml

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned Lina IPA
    runs-on: macos-15
    timeout-minutes: 30

    env:
      # Pin the audited upstream source instead of building a moving branch.
      LINA_COMMIT: 0dba26ca52cbfd2acf84e748b870c4e66752d8d0
      LIBNEO_COMMIT: bb31e0303069de9fa8b733b2a3c763aec19368da

    steps:
      - name: Fetch pinned Lina source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/0xilis/Lina.git "$RUNNER_TEMP/Lina"
          cd "$RUNNER_TEMP/Lina"
          git checkout --detach "$LINA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LINA_COMMIT"

          git clone --filter=blob:none https://github.com/0xilis/libNeoAppleArchive.git \
            "$RUNNER_TEMP/libNeoAppleArchive"
          cd "$RUNNER_TEMP/libNeoAppleArchive"
          git checkout --detach "$LIBNEO_COMMIT"
          test "$(git rev-parse HEAD)" = "$LIBNEO_COMMIT"
          git submodule update --init --recursive

      - name: Rebuild upstream iOS static libraries
        shell: bash
        run: |
          set -euo pipefail

          source_root="$RUNNER_TEMP/libNeoAppleArchive"
          static_dir="$RUNNER_TEMP/Lina/Lina/Libraries/Static"
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang_path="$(xcrun --sdk iphoneos --find clang)"

          mkdir -p "$static_dir"
          cp "$source_root/ios-support/libcrypto.a" "$static_dir/libcrypto.a"
          cp "$source_root/ios-support/libssl.a" "$static_dir/libssl.a"

          common_flags=(
            -arch arm64
            -isysroot "$sdk_path"
            -miphoneos-version-min=13.0
            -Os
            -fvisibility=hidden
          )

          build_archive() {
            local output="$1"
            local include_root="$2"
            shift 2
            local object_dir="$RUNNER_TEMP/objects-$(basename "$output" .a)"
            rm -rf "$object_dir"
            mkdir -p "$object_dir"

            local source
            local index=0
            for source in "$@"; do
              "$clang_path" "${common_flags[@]}" -I"$include_root" \
                -c "$source" -o "$object_dir/$index.o"
              index=$((index + 1))
            done
            test "$index" -gt 0
            xcrun libtool -static -o "$output" "$object_dir"/*.o
          }

          lzfse_root="$source_root/libNeoAppleArchive/compression/lzfse/src"
          lzfse_sources=("$lzfse_root"/*.c)
          build_archive "$static_dir/liblzfse.a" "$lzfse_root" \
            "${lzfse_sources[@]}"

          zbitmap_root="$source_root/libNeoAppleArchive/compression/libzbitmap"
          build_archive "$static_dir/libzbitmap.a" "$zbitmap_root" \
            "$zbitmap_root/libzbitmap.c"

          neo_root="$source_root/libNeoAppleArchive"
          neo_sources=("$neo_root"/*.c)
          neo_object_dir="$RUNNER_TEMP/objects-libNeoAppleArchive"
          rm -rf "$neo_object_dir"
          mkdir -p "$neo_object_dir"
          index=0
          for source in "${neo_sources[@]}"; do
            "$clang_path" "${common_flags[@]}" \
              -I"$neo_root" \
              -I"$lzfse_root" \
              -I"$zbitmap_root" \
              -I"$source_root/ios-support" \
              -DOPENSSL_API_COMPAT=30400 \
              -Wno-deprecated-declarations \
              -c "$source" -o "$neo_object_dir/$index.o"
            index=$((index + 1))
          done
          test "$index" -gt 0
          xcrun libtool -static -o "$static_dir/libNeoAppleArchive.a" \
            "$neo_object_dir"/*.o

          for archive in "$static_dir"/*.a; do
            test -s "$archive"
            lipo -info "$archive"
          done

      - name: Build for a physical iPhone without code signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Lina"

          xcodebuild \
            -project Lina.xcodeproj \
            -target Lina \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/LinaSourcePackages" \
            SYMROOT="$RUNNER_TEMP/LinaBuild" \
            OBJROOT="$RUNNER_TEMP/LinaObj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            build

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/LinaBuild/Release-iphoneos/Lina.app"
          output_dir="$RUNNER_TEMP/LinaArtifact"
          payload_dir="$output_dir/Payload"

          test -d "$app_path"
          test -x "$app_path/Lina"
          test -d "$app_path/PlugIns/LinaIntents.appex"

          mkdir -p "$payload_dir"
          cp -R "$app_path" "$payload_dir/Lina.app"

          # The next signer must sign both the app and its Intents extension.
          find "$payload_dir" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$payload_dir" -type f -name embedded.mobileprovision -delete

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$payload_dir/Lina.app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$payload_dir/Lina.app/PlugIns/LinaIntents.appex/Info.plist"

          cd "$output_dir"
          ditto -c -k --sequesterRsrc --keepParent Payload Lina-unsigned.ipa
          shasum -a 256 Lina-unsigned.ipa > Lina-unsigned.ipa.sha256
          unzip -t Lina-unsigned.ipa

      - name: Upload Lina IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lina-unsigned-IPA
          path: |
            ${{ runner.temp }}/LinaArtifact/Lina-unsigned.ipa
            ${{ runner.temp }}/LinaArtifact/Lina-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
